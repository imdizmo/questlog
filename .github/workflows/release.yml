name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (vX.Y.Z)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  QUESTLOG_NO_CAP: '1'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xz-utils
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Read the Node version
        id: node
        run: echo "version=$(tr -d '[:space:]v' < scripts/node-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --locked --version '^2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Desktop shell tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - run: bash scripts/package-desktop.sh "$TAG" dist linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Read the Node version
        id: node
        run: echo "version=$(tr -d '[:space:]v' < scripts/node-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: zip and unzip for the packaging script
        shell: pwsh
        run: choco install zip unzip -y --no-progress
      - run: cargo install tauri-cli --locked --version '^2'
      - run: pnpm install --frozen-lockfile
      - name: Build Questlog.exe
        working-directory: desktop/src-tauri
        # The exe's version metadata follows the tag, as in package-desktop.sh.
        run: cargo tauri build --no-bundle --config "{\"version\":\"${TAG#v}\"}"
      # Code signing is not set up. When it is, sign desktop/src-tauri/target/release/Questlog.exe here with
      # Azure Trusted Signing (azure/trusted-signing-action) before it is packaged.
      - name: Package the archive
        run: |
          export QUESTLOG_WIN_EXE="$PWD/desktop/src-tauri/target/release/Questlog.exe"
          bash scripts/package-desktop.sh "$TAG" dist win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # The notes are this version's section of CHANGELOG.md, so the file and the release never differ.
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          # Only the archives and their checksums: the download step also leaves a web/ folder in dist.
          gh release create "$TAG" dist/Questlog-v* --verify-tag --title "Questlog ${TAG#v}" --notes-file notes.md
